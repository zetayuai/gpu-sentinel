# Mini GPU-telemetry platform: Kafka -> Spark Structured Streaming -> Iceberg on MinIO -> Trino
# plus Prometheus + Grafana for the operational path.
# Run:  docker compose up -d   (needs ~8-10 GB RAM in Docker Desktop)
services:

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic telemetry.gpu.raw --partitions 8 --replication-factor 1 --config retention.ms=604800000 &&
       /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic telemetry.dlq --partitions 1 --replication-factor 1"

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    command: ["--kafka.server=kafka:19092"]
    ports: ["9308:9308"]
    depends_on:
      kafka: { condition: service_healthy }
    restart: unless-stopped

  producer:
    build: ./producer
    container_name: gpu-producer
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      NUM_HOSTS: "2000"
      GPUS_PER_HOST: "8"
      INTERVAL_SEC: "5"
    ports: ["8000:8000"]   # its own /metrics for Prometheus
    restart: unless-stopped

  copilot:
    build: ./copilot
    container_name: ir-copilot
    ports: ["8501:8501"]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      TRINO_HOST: trino
      BACKEND: ${COPILOT_BACKEND:-clickhouse}
      CH_HOST: clickhouse
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      SENSO_API_KEY: ${SENSO_API_KEY:-}
      SENSO_BASE_URL: ${SENSO_BASE_URL:-https://sdk.senso.ai/api/v1}
    depends_on: [trino, clickhouse]
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    ports: ["8123:8123", "9005:9000"]
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d
      - ./clickhouse:/backfill
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      MINIO_DOMAIN: minio
    ports: ["9000:9000", "9001:9001"]
    command: ["server", "/data", "--console-address", ":9001"]

  mc:
    image: minio/mc
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "until mc alias set minio http://minio:9000 admin password; do sleep 2; done;
       mc mb -p minio/warehouse; mc anonymous set public minio/warehouse; tail -f /dev/null"

  rest:
    image: tabulario/iceberg-rest
    container_name: iceberg-rest
    ports: ["8181:8181"]
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    depends_on: [minio]

  spark:
    image: tabulario/spark-iceberg
    container_name: spark
    depends_on: [rest, minio, kafka]
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
    volumes:
      - ./spark:/home/iceberg/jobs
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    ports: ["8888:8888", "4040:4040"]

  trino:
    image: trinodb/trino:455
    container_name: trino
    ports: ["8080:8080"]
    volumes:
      - ./trino/catalog:/etc/trino/catalog
    depends_on: [rest, minio]

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on: [prometheus]
